spring:
  application:
    name: todoapp

  main:
    lazy-initialization: false

  config:
    import: secrets.yaml

  r2dbc:
    username: postgres
    password: postgres

  flyway:
    enabled: true
    sql-migration-prefix: ""
    sql-migration-separator: "_"
    user: postgres
    password: postgres
    # We can't put the seed.sql in a separate folder and add it to locations,
    # because flyway will complain that the locations overlap.
    # The alternative is to use a before each hook to run the seed sql
    locations: filesystem:newz_supabase/supabase/migrations
    baseline-on-migrate: true
    validate-migration-naming: true
    fail-on-missing-locations: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jws-algorithms:
            - ES256
          # This tells Spring where to fetch the public keysc
          jwk-set-uri: http://localhost:54321/auth/v1/.well-known/jwks.json
          # This tells Spring to validate the 'iss' claim in the JWT. Enable once Hosted.
          # issuer-uri: https://<your-project>.supabase.co/auth/v1
          # Optional audience validation
          # audiences: my-api-audience


  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080

logging:
  level:
    root: info

app:
  logging:
    enabled: true
    max-body-bytes: 4096
  jwt-filter:
    jwt-expiration-duration-in-seconds: 3600
